<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart QA Assistant - Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <header>
    <div class="logo">
      <i class="material-icons">biotech</i>
      <div class="logo-text">
        <span>Smart QA</span>
        <small>v3.0.0 (IA RoBERTa)</small>
      </div>
    </div>
    <div id="ia-status" class="online-pulse" title="Moteur IA Connecté">
        <i class="material-icons">sensors</i>
        <small>IA ACTIVE</small>
    </div>
  </header>

  <div id="stats-bar">
    <div class="stat-item" title="Total des scénarios analysés">
      <span id="total-count">0</span>
      <small>Analyses</small>
    </div>
    <div class="stat-item status-passed" title="Tests sans anomalie">
      <span id="passed-count">0</span>
      <small>Succès</small>
    </div>
    <div class="stat-item status-failed" title="Anomalies détectées par l'IA">
      <span id="failed-count">0</span>
      <small>Bugs</small>
    </div>
  </div>

  <div id="selenium-notice" class="automation-banner" style="display: none;">
    <i class="material-icons">smart_toy</i>
    <span>MODE WEBDRIVER : MONITORING ACTIF</span>
  </div>

  <main id="timeline">
    <div class="empty-state">
      <i class="material-icons rotate">sync</i>
      <p>Initialisation du Bridge SmartQA...</p>
    </div>
  </main>

  <div id="details-panel" class="side-panel" style="display: none;">
    <div class="panel-header">
      <div class="panel-title">
        <i class="material-icons">psychology</i>
        <span>DIAGNOSTIC IA</span>
      </div>
      <button id="close-panel" class="close-btn" title="Fermer les détails">
        <i class="material-icons">close</i>
      </button>
    </div>
    
    <div id="detail-content" class="scrollable-content">
        </div>
  </div>

  <footer class="actions-bar">
    <div class="secondary-actions">
        <button id="clear-btn" class="icon-btn" title="Réinitialiser l'historique">
          <i class="material-icons">delete_sweep</i>
        </button>

        <button id="download-report-btn" class="icon-btn" title="Exporter le rapport JSON (Preuve PFE)">
          <i class="material-icons">file_download</i>
        </button>
    </div>
    
    <button id="jira-global-btn" class="main-btn jira-color">
      <i class="material-icons">assignment_late</i> 
      <span>CRÉER TICKET JIRA</span>
    </button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
